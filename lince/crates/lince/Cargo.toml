[package]
name = "lince"
description = "Buscador de archivos instantaneo para Windows (lee la MFT de NTFS)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "lince-cli"
path = "src/main.rs"

[dependencies]
lince-core = { path = "../lince-core" }
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
lince-testdata = { path = "../lince-testdata" }
tempfile = "3"
