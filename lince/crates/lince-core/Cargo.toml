[package]
name = "lince-core"
description = "Indice en memoria, consultas y busqueda de Lince"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
lince-ntfs = { path = "../lince-ntfs" }
rayon = "1.12"
memchr = "2.8"
regex = "1.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Texto dentro de los archivos (mismas versiones de zip y quick-xml que calamine).
calamine = "0.38"
cfb = "0.16"
encoding_rs = "0.8"
pdf-extract = "0.12"
quick-xml = "0.42"
zip = { version = "9.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
lince-testdata = { path = "../lince-testdata" }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
