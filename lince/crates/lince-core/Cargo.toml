[package]
name = "lince-core"
description = "Indice en memoria, consultas y busqueda de Lince"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
lince-ntfs = { path = "../lince-ntfs" }
rayon = "1.12"
memchr = "2.8"
regex = "1.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
lince-testdata = { path = "../lince-testdata" }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
] }
