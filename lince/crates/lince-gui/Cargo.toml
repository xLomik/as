[package]
name = "lince-gui"
description = "Lince con ventana de Windows: buscar archivos al instante"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "Lince"
path = "src/main.rs"

[dependencies]
lince-core = { path = "../lince-core" }
rayon = "1.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
lince-testdata = { path = "../lince-testdata" }

[build-dependencies]
embed-resource = "3.0"
