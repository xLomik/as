name: Lince

# Pruebas en Linux y Windows, prueba real contra la MFT del runner de
# Windows (que corre como administrador) y Lince.exe + lince-cli.exe como artefacto.

on:
  push:
    branches: ["**"]
    paths:
      - "lince/**"
      - ".github/workflows/lince.yml"
    tags: ["lince-v*"]
  pull_request:
    paths:
      - "lince/**"
      - ".github/workflows/lince.yml"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lince
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lince

      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Pruebas
        run: cargo test --workspace

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lince
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lince

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Pruebas
        run: cargo test --workspace

      - name: Compilar Lince.exe (ventana) y lince-cli.exe (consola)
        run: cargo build --release -p lince -p lince-gui

      - name: Prueba real contra la MFT del volumen
        shell: pwsh
        run: |
          $exe = Resolve-Path "target\release\lince-cli.exe"
          $root = Join-Path $env:RUNNER_TEMP "lince-prueba"
          New-Item -ItemType Directory -Force (Join-Path $root "Sub Carpeta") | Out-Null
          $uno = Join-Path $root "marcador-lince-uno.txt"
          $dos = Join-Path $root "Sub Carpeta\marcador-lince-dos ñ.bin"
          $enlace = Join-Path $root "marcador-lince-enlace.txt"
          [IO.File]::WriteAllText($uno, "hola")
          [IO.File]::WriteAllBytes($dos, (New-Object byte[] 12345))
          New-Item -ItemType HardLink -Path $enlace -Target $uno | Out-Null
          if (-not (Test-Path $enlace)) { throw "no se pudo crear el hard link" }
          $vol = (Get-Item $root).PSDrive.Name + ":"
          Write-Host "Volumen de prueba: $vol"

          $csv = Join-Path $env:RUNNER_TEMP "resultados.csv"
          # stderr (--stats) a texto: debe confirmar que se leyó la MFT y no se
          # recurrió al recorrido de carpetas.
          $log = & $exe --volume $vol --stats --csv $csv marcador-lince 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $log | Write-Host
          if ($code -ne 0) { throw "lince termino con codigo $code" }
          if (-not ($log -match "\] MFT")) { throw "no se leyo la MFT (¿sin administrador?)" }

          $rows = @(Import-Csv -Path $csv -Delimiter ";" -Encoding utf8)
          $rows | Format-Table | Out-String | Write-Host
          $want = @{ $uno = "4"; $dos = "12345"; $enlace = "4" }
          if ($rows.Count -ne $want.Count) { throw "se esperaban $($want.Count) resultados, hay $($rows.Count)" }
          foreach ($r in $rows) {
            $key = $want.Keys | Where-Object { $_ -ieq $r.ruta }
            if (-not $key) { throw "resultado inesperado: $($r.ruta)" }
            if ($r.'tamaño' -ne $want[$key]) { throw "$($r.ruta): tamaño $($r.'tamaño'), se esperaba $($want[$key])" }
          }
          Write-Host "OK: rutas y tamaños coinciden con la MFT"

      - name: Rendimiento en el volumen del sistema
        shell: pwsh
        run: |
          $exe = Resolve-Path "target\release\lince-cli.exe"
          & $exe --volume C: --stats --count "*"
          & $exe --volume C: --stats --limit 5 cmd.exe

      - name: Recorrido de carpetas (--path)
        shell: pwsh
        run: |
          $exe = Resolve-Path "target\release\lince-cli.exe"
          $out = & $exe --path $env:RUNNER_TEMP marcador-lince-uno
          if (-not ($out -match "marcador-lince-uno.txt")) { throw "el recorrido no encontro el archivo: $out" }
          Write-Host $out

      - name: Unidades de red (SMB) y carpetas UNC
        shell: pwsh
        run: |
          $exe = Resolve-Path "target\release\lince-cli.exe"
          $root = Join-Path $env:RUNNER_TEMP "lince-prueba"
          New-SmbShare -Name "Lince Red" -Path $root -FullAccess "Everyone" | Out-Null
          $unc = "\\localhost\Lince Red"

          # 1) Ruta UNC directa (recorrido con 32 listados simultaneos).
          $out = & $exe --path $unc --stats marcador-lince-dos 2>&1 | ForEach-Object { "$_" }
          $out | Write-Host
          if (-not ($out -match [regex]::Escape("$unc\Sub Carpeta\marcador-lince-dos ñ.bin"))) {
            throw "no se encontro el archivo por la ruta UNC"
          }

          # 2) Unidad de red con letra: debe entrar sola en las fuentes por defecto.
          net use Z: $unc /persistent:no | Out-Null
          $out = & $exe --stats marcador-lince-dos 2>&1 | ForEach-Object { "$_" }
          $out | Write-Host
          if (-not ($out -match [regex]::Escape("Z:\Sub Carpeta\marcador-lince-dos ñ.bin"))) {
            throw "la unidad de red Z: no se incluyo en la busqueda"
          }
          net use Z: /delete /y | Out-Null

          # 3) La ventana recibe la unidad de red como la recibiria tras el UAC.
          $gui = Resolve-Path "target\release\Lince.exe"
          $p = Start-Process -FilePath $gui -ArgumentList @("--elevado", "--extra", "`"$unc`"") -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          do { Start-Sleep -Milliseconds 500; $p.Refresh() } until ($p.MainWindowTitle -like "Lince*" -or $p.HasExited -or (Get-Date) -gt $deadline)
          if ($p.HasExited) { throw "Lince.exe termino solo (codigo $($p.ExitCode))" }
          [void]$p.CloseMainWindow()
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "la ventana no se cerro" }
          Remove-SmbShare -Name "Lince Red" -Force
          Write-Host "OK: rutas UNC, unidades de red con letra y ventana con --extra"

      - name: La ventana abre y cierra bien
        shell: pwsh
        run: |
          $gui = Resolve-Path "target\release\Lince.exe"
          $p = Start-Process -FilePath $gui -ArgumentList @("--path", "$env:RUNNER_TEMP\lince-prueba") -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
          } until ($p.MainWindowTitle -like "Lince*" -or $p.HasExited -or (Get-Date) -gt $deadline)
          if ($p.HasExited) { throw "Lince.exe termino solo (codigo $($p.ExitCode))" }
          if ($p.MainWindowTitle -notlike "Lince*") { throw "no aparecio la ventana" }
          Write-Host "Ventana: $($p.MainWindowTitle)"
          [void]$p.CloseMainWindow()
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw "la ventana no se cerro" }
          if ($p.ExitCode -ne 0) { throw "codigo de salida $($p.ExitCode)" }
          Write-Host "OK: la ventana abre, muestra su titulo y cierra limpio"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: lince-windows
          path: |
            lince/target/release/Lince.exe
            lince/target/release/lince-cli.exe
            lince/README.md
