name: Lince

# Pruebas en Linux y Windows, prueba real contra la MFT del runner de
# Windows (que corre como administrador) y Lince.exe + lince-cli.exe como artefacto.

on:
  push:
    branches: ["**"]
    paths:
      - "lince/**"
      - ".github/workflows/lince.yml"
    tags: ["lince-v*"]
  pull_request:
    paths:
      - "lince/**"
      - ".github/workflows/lince.yml"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lince
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lince

      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Pruebas
        run: cargo test --workspace

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lince
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lince

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Pruebas
        run: cargo test --workspace

      - name: Compilar Lince.exe (ventana), lince-cli.exe (consola) y la caja de la barra de tareas
        run: |
          cargo build --release -p lince -p lince-gui -p lince-barra
          cargo build --release -p lince-barra --example prueba_caja

      - name: Prueba real contra la MFT del volumen
        shell: pwsh
        run: |
          $exe = Resolve-Path "target\release\lince-cli.exe"
          $root = Join-Path $env:RUNNER_TEMP "lince-prueba"
          New-Item -ItemType Directory -Force (Join-Path $root "Sub Carpeta") | Out-Null
          $uno = Join-Path $root "marcador-lince-uno.txt"
          $dos = Join-Path $root "Sub Carpeta\marcador-lince-dos ñ.bin"
          $enlace = Join-Path $root "marcador-lince-enlace.txt"
          [IO.File]::WriteAllText($uno, "hola")
          [IO.File]::WriteAllBytes($dos, (New-Object byte[] 12345))
          New-Item -ItemType HardLink -Path $enlace -Target $uno | Out-Null
          if (-not (Test-Path $enlace)) { throw "no se pudo crear el hard link" }
          $vol = (Get-Item $root).PSDrive.Name + ":"
          Write-Host "Volumen de prueba: $vol"

          $csv = Join-Path $env:RUNNER_TEMP "resultados.csv"
          # stderr (--stats) a texto: debe confirmar que se leyó la MFT y no se
          # recurrió al recorrido de carpetas.
          $log = & $exe --volume $vol --stats --csv $csv marcador-lince 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $log | Write-Host
          if ($code -ne 0) { throw "lince termino con codigo $code" }
          if (-not ($log -match "\] MFT")) { throw "no se leyo la MFT (¿sin administrador?)" }

          $rows = @(Import-Csv -Path $csv -Delimiter ";" -Encoding utf8)
          $rows | Format-Table | Out-String | Write-Host
          $want = @{ $uno = "4"; $dos = "12345"; $enlace = "4" }
          if ($rows.Count -ne $want.Count) { throw "se esperaban $($want.Count) resultados, hay $($rows.Count)" }
          foreach ($r in $rows) {
            $key = $want.Keys | Where-Object { $_ -ieq $r.ruta }
            if (-not $key) { throw "resultado inesperado: $($r.ruta)" }
            if ($r.'tamaño' -ne $want[$key]) { throw "$($r.ruta): tamaño $($r.'tamaño'), se esperaba $($want[$key])" }
          }
          Write-Host "OK: rutas y tamaños coinciden con la MFT"

      - name: Rendimiento en el volumen del sistema
        shell: pwsh
        run: |
          $exe = Resolve-Path "target\release\lince-cli.exe"
          & $exe --volume C: --stats --count "*"
          & $exe --volume C: --stats --limit 5 cmd.exe

      - name: Recorrido de carpetas (--path)
        shell: pwsh
        run: |
          $exe = Resolve-Path "target\release\lince-cli.exe"
          $out = & $exe --path $env:RUNNER_TEMP marcador-lince-uno
          if (-not ($out -match "marcador-lince-uno.txt")) { throw "el recorrido no encontro el archivo: $out" }
          Write-Host $out

      - name: Buscar dentro de Word, Excel, PDF y texto
        shell: pwsh
        run: |
          $exe = Resolve-Path "target\release\lince-cli.exe"
          $docs = Resolve-Path "fixtures\contenido"
          $out = & $exe --stats --path $docs 'contenido:"orden de compra 4512"'
          Write-Host ($out -join "`n")
          if ($out.Count -ne 8) { throw "se esperaban 8 documentos, salieron $($out.Count)" }
          foreach ($f in "documento-97.doc", "documento.docx", "documento.pdf", "navegador.pdf", "texto-utf16.txt", "texto-ansi.txt") {
            if (-not ($out -match [regex]::Escape($f))) { throw "falta $f" }
          }
          $out = & $exe --path $docs "ext:xls;xlsx;ods" "content:4512,75"
          if ($out.Count -ne 3) { throw "hojas: $out" }
          Write-Host "OK: contenido de .doc/.docx/.odt/.pdf/.txt y .xls/.xlsx/.ods"

      - name: Unidades de red (SMB) y carpetas UNC
        shell: pwsh
        run: |
          $exe = Resolve-Path "target\release\lince-cli.exe"
          $root = Join-Path $env:RUNNER_TEMP "lince-prueba"
          New-SmbShare -Name "Lince Red" -Path $root -FullAccess "Everyone" | Out-Null
          $unc = "\\localhost\Lince Red"

          # 1) Ruta UNC directa (recorrido con 32 listados simultaneos).
          $out = & $exe --path $unc --stats marcador-lince-dos 2>&1 | ForEach-Object { "$_" }
          $out | Write-Host
          if (-not ($out -match [regex]::Escape("$unc\Sub Carpeta\marcador-lince-dos ñ.bin"))) {
            throw "no se encontro el archivo por la ruta UNC"
          }

          # 2) Unidad de red con letra: debe entrar sola en las fuentes por defecto.
          net use Z: $unc /persistent:no | Out-Null
          $out = & $exe --stats marcador-lince-dos 2>&1 | ForEach-Object { "$_" }
          $out | Write-Host
          if (-not ($out -match [regex]::Escape("Z:\Sub Carpeta\marcador-lince-dos ñ.bin"))) {
            throw "la unidad de red Z: no se incluyo en la busqueda"
          }
          net use Z: /delete /y | Out-Null

          # 2b) Unidad guardada para reconectarse (HKCU\Network) pero sin letra
          #     conectada: lo que ve Lince con permisos de administrador o al
          #     iniciar sesion. Se lee por la ruta real y se muestra con la letra.
          New-Item -Path "HKCU:\Network\Y" -Force | Out-Null
          Set-ItemProperty -Path "HKCU:\Network\Y" -Name RemotePath -Value $unc
          New-Item -Path "HKCU:\Network\W" -Force | Out-Null
          Set-ItemProperty -Path "HKCU:\Network\W" -Name RemotePath -Value "\\localhost\No Existe Lince"
          $out = & $exe --stats marcador-lince-dos 2>&1 | ForEach-Object { "$_" }
          $out | Write-Host
          Remove-Item -Path "HKCU:\Network\Y", "HKCU:\Network\W" -Recurse -Force
          if (-not ($out -match [regex]::Escape("Y:\Sub Carpeta\marcador-lince-dos ñ.bin"))) {
            throw "la unidad guardada Y: (sin conectar) no se leyo por su ruta real"
          }
          if (-not ($out -match [regex]::Escape("W: (\\localhost\No Existe Lince) no está disponible ahora"))) {
            throw "falta el aviso claro de la unidad W: que no responde"
          }

          # 3) La ventana recibe la unidad de red como la recibiria tras el UAC.
          $gui = Resolve-Path "target\release\Lince.exe"
          $p = Start-Process -FilePath $gui -ArgumentList @("--elevado", "--extra", "`"$unc`"") -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          do { Start-Sleep -Milliseconds 500; $p.Refresh() } until ($p.MainWindowTitle -like "Lince*" -or $p.HasExited -or (Get-Date) -gt $deadline)
          if ($p.HasExited) { throw "Lince.exe termino solo (codigo $($p.ExitCode))" }
          # Sin carpeta fija, cerrar la deja junto al reloj: --salir la cierra.
          Start-Process -FilePath $gui -ArgumentList "--salir" -Wait
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "la ventana no se cerro" }
          Remove-SmbShare -Name "Lince Red" -Force
          Write-Host "OK: rutas UNC, unidades de red con letra y ventana con --extra"

      - name: La ventana abre y cierra bien
        shell: pwsh
        run: |
          $gui = Resolve-Path "target\release\Lince.exe"
          $p = Start-Process -FilePath $gui -ArgumentList @("--path", "$env:RUNNER_TEMP\lince-prueba") -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
          } until ($p.MainWindowTitle -like "Lince*" -or $p.HasExited -or (Get-Date) -gt $deadline)
          if ($p.HasExited) { throw "Lince.exe termino solo (codigo $($p.ExitCode))" }
          if ($p.MainWindowTitle -notlike "Lince*") { throw "no aparecio la ventana" }
          Write-Host "Ventana: $($p.MainWindowTitle)"
          [void]$p.CloseMainWindow()
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw "la ventana no se cerro" }
          if ($p.ExitCode -ne 0) { throw "codigo de salida $($p.ExitCode)" }
          Write-Host "OK: la ventana abre, muestra su titulo y cierra limpio"

      - name: Clic derecho del Explorador (Buscar aqui con Lince)
        shell: pwsh
        run: |
          $gui = (Resolve-Path "target\release\Lince.exe").Path
          $base = "HKCU:\Software\Classes"
          $marcas = @{ "Directory\Background" = "%V"; "Directory" = "%1"; "Drive" = "%1" }

          $p = Start-Process -FilePath $gui -ArgumentList "--instalar-menu" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--instalar-menu termino con $($p.ExitCode)" }
          foreach ($k in $marcas.Keys) {
            $cmd = (Get-Item "$base\$k\shell\Lince\command").GetValue("")
            $quiero = "`"$gui`" --carpeta `"$($marcas[$k])`""
            if ($cmd -ne $quiero) { throw "${k}: '$cmd' (se esperaba '$quiero')" }
            $texto = (Get-Item "$base\$k\shell\Lince").GetValue("MUIVerb")
            Write-Host "$k -> $texto :: $cmd"
          }

          # Lo mismo que hace el Explorador: el comando registrado con la
          # carpeta en lugar de %V, tal cual (con sus comillas).
          function Abrir([string]$carpeta) {
            $cmd = (Get-Item "$base\Directory\Background\shell\Lince\command").GetValue("")
            $resto = $cmd.Substring($cmd.IndexOf('" ') + 2).Replace("%V", $carpeta)
            $p = Start-Process -FilePath $gui -ArgumentList $resto -PassThru
            $deadline = (Get-Date).AddSeconds(30)
            do { Start-Sleep -Milliseconds 500; $p.Refresh() } until ($p.MainWindowTitle -like "Lince*" -or $p.HasExited -or (Get-Date) -gt $deadline)
            if ($p.HasExited) { throw "Lince termino solo con $carpeta (codigo $($p.ExitCode))" }
            $titulo = $p.MainWindowTitle
            [void]$p.CloseMainWindow()
            if (-not $p.WaitForExit(15000)) { $p.Kill(); throw "la ventana de $carpeta no se cerro" }
            if (-not $titulo.EndsWith(" $carpeta")) { throw "titulo '$titulo' para $carpeta" }
            Write-Host "Ventana: $titulo"
          }
          $dir = Join-Path $env:RUNNER_TEMP "Carpeta del clic derecho"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Abrir $dir
          # Raiz de unidad: llega como "C:\" y Windows la parte en C:" (comilla escrita).
          Abrir "C:\"

          # Si Lince cambia de carpeta, la entrada se corrige al abrirlo.
          Set-Item "$base\Directory\Background\shell\Lince\command" -Value "`"C:\no-existe\Lince.exe`" --carpeta `"%V`""
          Abrir $dir
          $cmd = (Get-Item "$base\Directory\Background\shell\Lince\command").GetValue("")
          if (-not $cmd.StartsWith("`"$gui`"")) { throw "no se corrigio la ruta: $cmd" }

          $p = Start-Process -FilePath $gui -ArgumentList "--quitar-menu" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--quitar-menu termino con $($p.ExitCode)" }
          foreach ($k in $marcas.Keys) {
            if (Test-Path "$base\$k\shell\Lince") { throw "sigue la entrada de $k" }
          }
          Write-Host "OK: instalar, abrir como el Explorador (carpeta con espacios y C:\), corregir ruta y quitar"

      - name: Segundo plano junto al reloj y barra rapida
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern IntPtr FindWindow(string c, string t);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern IntPtr FindWindowEx(IntPtr p, IntPtr a, string c, string t);
            // PowerShell pasa $null como "" (titulo vacio): el null va desde aqui.
            public static IntPtr ByClass(string c) { return FindWindow(c, null); }
            public static IntPtr ChildByClass(IntPtr p, string c) { return FindWindowEx(p, IntPtr.Zero, c, null); }
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h, int m, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] static extern void keybd_event(byte vk, byte scan, int flags, IntPtr extra);
            [DllImport("shell32.dll")] public static extern bool IsUserAnAdmin();
            static void Key(byte vk, bool up) { keybd_event(vk, 0, up ? 2 : 0, IntPtr.Zero); }
            public static void Tap(byte vk) { Key(vk, false); Key(vk, true); }
            public static void CtrlAltSpace() { Key(0x11, false); Key(0x12, false); Tap(0x20); Key(0x12, true); Key(0x11, true); }
            public static void Type(string s) { foreach (char c in s.ToUpperInvariant()) Tap((byte)c); }
          }
          "@
          function Diagnostico {
            Write-Host "IsUserAnAdmin: $([W]::IsUserAnAdmin())"
            Get-Process Lince -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host ("Lince pid {0} titulo '{1}' responde {2} hilos {3}" -f $_.Id, $_.MainWindowTitle, $_.Responding, $_.Threads.Count)
            }
            Write-Host "Ventana principal: $([W]::ByClass('LinceVentanaPrincipal'))"
            Write-Host "Barra: $([W]::ByClass('LinceBarraRapida'))"
          }
          function Esperar([scriptblock]$cond, [int]$seg, [string]$que) {
            $fin = (Get-Date).AddSeconds($seg)
            while (-not (& $cond)) {
              if ((Get-Date) -gt $fin) { Diagnostico; throw "no paso: $que" }
              Start-Sleep -Milliseconds 300
            }
          }
          $gui = (Resolve-Path "target\release\Lince.exe").Path

          # 1) Abrir sin argumentos: la ventana que queda en segundo plano.
          $p = Start-Process -FilePath $gui -PassThru
          Esperar { [W]::ByClass("LinceVentanaPrincipal") -ne [IntPtr]::Zero } 30 "abrir la ventana"
          $main = [W]::ByClass("LinceVentanaPrincipal")
          Esperar { [W]::IsWindowVisible($main) } 30 "mostrar la ventana"

          # 2) Cerrarla la esconde: el proceso (y el indice) siguen.
          $WM_CLOSE = 0x10
          [void][W]::SendMessage($main, $WM_CLOSE, [IntPtr]::Zero, [IntPtr]::Zero)
          Esperar { -not [W]::IsWindowVisible($main) } 10 "esconder al cerrar"
          Start-Sleep -Seconds 1
          if ($p.HasExited) { throw "Lince termino al cerrar la ventana" }
          Write-Host "OK: cerrar la deja junto al reloj"

          # 3) Abrirlo otra vez muestra la misma copia y la nueva termina enseguida.
          $t = Measure-Command { $q = Start-Process -FilePath $gui -PassThru -Wait }
          if ($q.ExitCode -ne 0) { throw "la segunda copia termino con $($q.ExitCode)" }
          Esperar { [W]::IsWindowVisible($main) } 10 "volver a mostrar la ventana"
          Write-Host ("OK: segunda copia en {0:N2} s, la ventana reaparece" -f $t.TotalSeconds)
          [void][W]::SendMessage($main, $WM_CLOSE, [IntPtr]::Zero, [IntPtr]::Zero)
          Esperar { -not [W]::IsWindowVisible($main) } 10 "esconder otra vez"

          # 4) Ctrl+Alt+Espacio abre la barra; escribir busca; Esc la esconde.
          $bar = [W]::ByClass("LinceBarraRapida")
          if ($bar -eq [IntPtr]::Zero) { throw "no existe la barra rapida" }
          [W]::CtrlAltSpace()
          Esperar { [W]::IsWindowVisible($bar) } 10 "abrir la barra con Ctrl+Alt+Espacio"
          [W]::Type("notepad")
          $list = [W]::ChildByClass($bar, "SysListView32")
          # LVM_GETITEMCOUNT; espera tambien a que termine de leer C:.
          Esperar { [int][W]::SendMessage($list, 0x1004, [IntPtr]::Zero, [IntPtr]::Zero) -gt 0 } 90 "resultados en la barra"
          Write-Host "OK: la barra encontro $([int][W]::SendMessage($list, 0x1004, [IntPtr]::Zero, [IntPtr]::Zero)) resultados de notepad"
          [W]::Tap(0x1B)
          Esperar { -not [W]::IsWindowVisible($bar) } 10 "esconder la barra con Esc"
          Write-Host "OK: Esc esconde la barra"

          # 5) --salir la cierra del todo.
          Start-Process -FilePath $gui -ArgumentList "--salir" -Wait
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw "--salir no cerro Lince" }
          if ($p.ExitCode -ne 0) { throw "Lince termino con $($p.ExitCode)" }
          Write-Host "OK: --salir cierra Lince del todo"

      - name: Caja en la barra de tareas (DLL como la carga el Explorador, y con Lince real)
        shell: pwsh
        run: |
          $dll = (Resolve-Path "target\release\lince_barra.dll").Path
          $prueba = (Resolve-Path "target\release\examples\prueba_caja.exe").Path
          $gui = (Resolve-Path "target\release\Lince.exe").Path

          # 1) Sitio falso y Lince falso: carga, ventana, texto, teclas y foco.
          & $prueba $dll
          if ($LASTEXITCODE -ne 0) { throw "la caja fallo con el Lince falso" }

          # 2) Con Lince de verdad, abierto como al encender el equipo.
          $p = Start-Process -FilePath $gui -ArgumentList "--inicio" -PassThru
          Start-Sleep -Seconds 3
          & $prueba $dll --lince
          $codigo = $LASTEXITCODE
          Start-Process -FilePath $gui -ArgumentList "--salir" -Wait
          if (-not $p.WaitForExit(15000)) { $p.Kill() }
          if ($codigo -ne 0) { throw "la caja fallo con Lince real" }

          # 3) Registro para el usuario (sin administrador): DLL copiada y CLSID.
          $clsid = "{E5F9334C-A814-4B74-87CD-CD761F4F70A2}"
          $clave = "HKCU:\Software\Classes\CLSID\$clsid\InprocServer32"
          $q = Start-Process -FilePath $gui -ArgumentList "--instalar-barra" -PassThru
          if (-not $q.WaitForExit(60000)) { $q.Kill(); Write-Host "AVISO: mostrar la barra no respondio (sin Explorador interactivo)" }
          $ruta = (Get-Item $clave).GetValue("")
          if (-not (Test-Path $ruta)) { throw "la DLL registrada no existe: $ruta" }
          if ($ruta -notlike "$env:LOCALAPPDATA\Lince\barra\lince_barra-*.dll") { throw "DLL en lugar raro: $ruta" }
          if ((Get-Item $clave).GetValue("ThreadingModel") -ne "Apartment") { throw "ThreadingModel" }
          Write-Host "Registrada: $ruta (codigo $($q.ExitCode))"
          $q = Start-Process -FilePath $gui -ArgumentList "--quitar-barra" -PassThru
          if (-not $q.WaitForExit(60000)) { $q.Kill() }
          if (Test-Path "HKCU:\Software\Classes\CLSID\$clsid") { throw "--quitar-barra no borro el registro" }
          Write-Host "OK: la caja funciona con el Explorador simulado y con Lince real; se registra y se quita"

      - name: Iniciar con Windows (tarea programada)
        shell: pwsh
        run: |
          $gui = (Resolve-Path "target\release\Lince.exe").Path
          $err = Join-Path $env:RUNNER_TEMP "inicio-error.txt"
          $q = Start-Process -FilePath $gui -ArgumentList "--instalar-inicio" -Wait -PassThru -RedirectStandardError $err
          if ($q.ExitCode -ne 0) { Get-Content $err; throw "--instalar-inicio termino con $($q.ExitCode)" }
          $xml = (schtasks /Query /TN Lince /XML ONE) -join "`n"
          foreach ($debe in @("<Command>$gui</Command>", "<Arguments>--inicio</Arguments>",
                              "<RunLevel>HighestAvailable</RunLevel>", "<LogonTrigger>",
                              "<DisallowStartIfOnBatteries>false</DisallowStartIfOnBatteries>",
                              "<StopIfGoingOnBatteries>false</StopIfGoingOnBatteries>",
                              "<ExecutionTimeLimit>PT0S</ExecutionTimeLimit>")) {
            if (-not $xml.Contains($debe)) { Write-Host $xml; throw "falta en la tarea: $debe" }
          }
          if ((Get-ItemProperty "HKCU:\Software\Lince").InicioExe -ne $gui) { throw "no se anoto InicioExe" }
          Write-Host "OK: tarea registrada con los ajustes correctos"

          # Ejecutarla como lo hace Windows al iniciar sesion: Lince queda escondido.
          schtasks /Run /TN Lince | Out-Null
          $fin = (Get-Date).AddSeconds(40)
          while (-not (Get-Process Lince -ErrorAction SilentlyContinue) -and (Get-Date) -lt $fin) { Start-Sleep -Milliseconds 500 }
          $l = Get-Process Lince -ErrorAction SilentlyContinue
          if ($l) {
            Start-Sleep -Seconds 2
            if ($l[0].MainWindowHandle -ne [IntPtr]::Zero) { throw "con --inicio la ventana no debe verse" }
            Write-Host "OK: la tarea abrio Lince escondido junto al reloj (pid $($l[0].Id))"
            Start-Process -FilePath $gui -ArgumentList "--salir" -Wait
            if (-not $l[0].WaitForExit(15000)) { throw "--salir no cerro la copia de la tarea" }
          } else {
            schtasks /Query /TN Lince /V /FO LIST | Select-String "Estado|Status|Resultado|Result"
            Write-Host "AVISO: la tarea no arranco aqui (el ejecutor puede no tener sesion interactiva)"
          }

          $q = Start-Process -FilePath $gui -ArgumentList "--quitar-inicio" -Wait -PassThru
          if ($q.ExitCode -ne 0) { throw "--quitar-inicio termino con $($q.ExitCode)" }
          schtasks /Query /TN Lince 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "la tarea sigue registrada" }
          if ((Get-ItemProperty "HKCU:\Software\Lince" -ErrorAction SilentlyContinue).InicioExe) { throw "quedo InicioExe" }
          Write-Host "OK: --quitar-inicio borra la tarea"
          # El último programa (schtasks /Query) falló a propósito: no es el resultado del paso.
          exit 0

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: lince-windows
          path: |
            lince/target/release/Lince.exe
            lince/target/release/lince-cli.exe
            lince/target/release/lince_barra.dll
            lince/README.md
