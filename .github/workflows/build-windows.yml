name: Build Windows EXE

# Compila el ejecutable portable PDF-a-Excel.exe en un runner Windows
# y lo publica como artefacto descargable. Si haces push de un tag vX.Y.Z,
# además lo adjunta a una Release.

on:
  push:
    branches: ["**"]
    paths:
      - "pdf2excel/**"
      - ".github/workflows/build-windows.yml"
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pdf2excel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compilar EXE
        run: python -m PyInstaller --noconfirm --clean pdf2excel.spec

      - name: Empaquetar (exe + bats + README)
        run: |
          mkdir release
          copy dist\PDF-a-Excel.exe release\
          copy Convertir-PDFs-aqui.bat release\
          copy Vigilar-carpeta.bat release\
          copy README.md release\

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PDF-a-Excel-windows
          path: pdf2excel/release/**

      - name: Adjuntar a Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pdf2excel/release/PDF-a-Excel.exe
